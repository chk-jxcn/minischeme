name: MiniScheme Core CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    # make test: the command line's answers are compared, then the MSBC,
    # compiler/VM and stress suites run (each fails the job on a failed check);
    # every build uses -Werror
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            m32: ''
          - os: ubuntu-latest
            cc: clang
            m32: ''
          - os: ubuntu-latest
            cc: gcc
            m32: '-m32'      # the 32-bit device profile (ESP32 word size)
          - os: windows-latest
            cc: gcc
            m32: ''

    steps:
    - uses: actions/checkout@v4

    - name: Install compilers (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc clang gcc-multilib make

    - name: Build and test (Linux)
      if: runner.os == 'Linux'
      run: make CC=${{ matrix.cc }} M32="${{ matrix.m32 }}" test

    - name: Build and test (Windows, MinGW)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        MAKE=$(command -v make || command -v mingw32-make)
        "$MAKE" CC=gcc test

  release:
    # releases come only from a pushed version tag (git tag v1.0.X)
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Package source archive
      run: zip -r minischeme-core-source.zip include src scm tests tools Makefile README.md

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "MiniScheme Core (${{ github.ref_name }})"
        make_latest: true
        files: minischeme-core-source.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
